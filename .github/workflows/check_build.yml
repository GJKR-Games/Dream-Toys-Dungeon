# https://github.com/marketplace/actions/build-godot
# https://github.com/FATESG-GJKLS/Emergencia-Vital/blob/main/.github/workflows/ci.yml
# Gemini (AI)
name: Build Godot Project

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - "feature/**"
      - "feat/**"
    
  pull_request:
    branches:
      - main # quando um PR tenta entrar no main
      - develop # quando um PR tenta entrar no develop

jobs:
  build_check:
    name: "Validate Godot Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Godot Export (Validation)
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_version: "4.7.2"
          godot_executable_file_path: "godot-headless"
          godot_export_target: "Windows Desktop" # Nome da predefinição criada em Export -> Presets no Godot
          project_directory: "."