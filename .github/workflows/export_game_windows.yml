name: Export Game

on:
  workflow_dispatch:

jobs:
  build_check:
    name: "Publish Godot Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Godot Export (Validation)
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz
          
          relative_project_path: ./
          presets_to_export: "Windows Desktop"
          use_preset_export_path: true
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-build
          path: builds/